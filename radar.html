<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {

    --background: #07111f;

    --card:
        rgba(255,255,255,0.075);

    --border:
        rgba(255,255,255,0.11);

    --blue: #7dd3fc;

    --muted:
        rgba(255,255,255,0.62);
}

body {

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: white;

    background:

        radial-gradient(
            circle at 15% 0%,
            rgba(56,189,248,0.16),
            transparent 35%

        radial-gradient(
            circle at 90% 20%,
            rgba(37,99,235,0.15),
            transparent 35%
        ),

        var(--background);

    padding-bottom: 100px;

    overflow-x: hidden;
}

.app {

    width: 100%;

    max-width: 1000px;

    margin: 0 auto;

    padding:
        24px 14px 30px;
}

/* HEADER */

.header {

    text-align: center;

    margin-bottom: 20px;
}

.header h1 {

    font-size: 27px;

    font-weight: 750;

    letter-spacing: -0.7px;
}

.header p {

    color: var(--muted);

    font-size: 14px;

    margin-top: 5px;
}

/* LAYER PICKER */

.layer-picker {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    justify-content: center;

    margin-bottom: 14px;
}

.layer-button {

    padding:
        9px 15px;

    border-radius: 13px;

    border:
        1px solid
        rgba(0,242,255,0.15);

    cursor: pointer;

    font-weight: 650;

    font-size: 13px;

    color:
        rgba(255,255,255,0.70);

    background:
        rgba(0,242,255,0.06);

    transition:
        transform 0.15s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;

    box-shadow:
        0 4px 16px
        rgba(0,120,255,0.10);
}

.layer-button:hover {

    transform:
        translateY(-1px);

    background:
        rgba(0,242,255,0.11);
}

.layer-button:active {

    transform:
        scale(0.96);
}

.layer-button.active {

    border-color:
        transparent;

    color:
        #07111f;
}

/* MAP */

.map-wrapper {

    position: relative;

    width: 100%;

    height: 78vh;

    min-height: 500px;

    max-height: 850px;

    border-radius: 24px;

    overflow: hidden;

    border:
        1px solid
        rgba(0,242,255,0.18);

    box-shadow:

        0 8px 40px
        rgba(0,120,255,0.20),

        0 1.5px 0
        rgba(0,242,255,0.20)
        inset;

    background: #0b1626;
}

#windy {

    position: absolute;

    left: 0;

    top: 0;

    width: 100%;

    height: 100%;
}

#windy > * {

    max-width: 100%;
}

/* =========================================================
   REAL GEOGRAPHIC BLUE LOCATION DOT
========================================================= */

.atmosphere-location-marker {

    background: transparent !important;

    border: none !important;

    width: 26px !important;

    height: 26px !important;

    pointer-events: none !important;
}

.atmosphere-location-dot {

    position: absolute;

    left: 50%;

    top: 50%;

    width: 20px;

    height: 20px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    background:
        #1683ff;

    border:
        3px solid white;

    box-shadow:

        0 0 0 3px
        rgba(22,131,255,0.30),

        0 2px 10px
        rgba(0,0,0,0.45);

    pointer-events: none;
}

.atmosphere-location-dot::after {

    content: "";

    position: absolute;

    left: 50%;

    top: 50%;

    width: 34px;

    height: 34px;

    transform:
        translate(-50%, -50%);

    border-radius: 50%;

    border:
        2px solid
        rgba(22,131,255,0.42);

    animation:
        locationPulse 2s ease-out infinite;

    pointer-events: none;
}

@keyframes locationPulse {

    0% {

        transform:
            translate(-50%, -50%)
            scale(0.55);

        opacity: 0.8;
    }

    70% {

        transform:
            translate(-50%, -50%)
            scale(1.15);

        opacity: 0;
    }

    100% {

        transform:
            translate(-50%, -50%)
            scale(1.15);

        opacity: 0;
    }
}

.atmosphere-location-pane {

    z-index: 10000 !important;

    pointer-events:
        none !important;
}

/* MAP LOCATION LABEL */

.map-label {

    position: absolute;

    top: 14px;

    left: 14px;

    z-index: 1000;

    padding:
        8px 12px;

    border-radius: 12px;

    background:
        rgba(7,17,31,0.72);

    border:
        1px solid
        rgba(255,255,255,0.14);

    color:
        rgba(255,255,255,0.92);

    font-size: 12px;

    font-weight: 650;

    backdrop-filter:
        blur(14px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(14px)
        saturate(160%);

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.20);

    pointer-events: none;

    transition:
        opacity 0.25s ease;
}

/* LOCATION LOADING */

.location-loading {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%);

    z-index: 2000;

    padding:
        12px 16px;

    border-radius: 14px;

    background:
        rgba(7,17,31,0.78);

    border:
        1px solid
        rgba(255,255,255,0.13);

    backdrop-filter:
        blur(16px);

    -webkit-backdrop-filter:
        blur(16px);

    color:
        rgba(255,255,255,0.9);

    font-size: 13px;

    font-weight: 650;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,0.28);

    transition:
        opacity 0.25s ease;
}

.location-loading.hidden {

    opacity: 0;

    pointer-events: none;
}

/* =========================================================
   LIQUID GLASS NAVIGATION
========================================================= */

.bottom-nav {

    position: fixed;

    left: 50%;

    bottom: 14px;

    transform:
        translateX(-50%);

    width:
        calc(100% - 24px);

    max-width: 620px;

    height: 72px;

    display: flex;

    justify-content:
        space-around;

    align-items: center;

    padding: 6px;

    background:

        linear-gradient(
            135deg,
            rgba(255,255,255,0.15),
            rgba(255,255,255,0.055)
        );

    border:
        1px solid
        rgba(255,255,255,0.18);

    border-radius: 999px;

    backdrop-filter:
        blur(30px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(180%);

    box-shadow:

        0 20px 55px
        rgba(0,0,0,0.38),

        0 4px 18px
        rgba(0,0,0,0.20),

        inset 0 1px 0
        rgba(255,255,255,0.28),

        inset 0 -1px 0
        rgba(255,255,255,0.06);

    overflow: hidden;

    z-index: 10000;

    isolation: isolate;

    transition:
        transform 0.35s
        cubic-bezier(0.22, 1, 0.36, 1),

        box-shadow 0.35s ease;
}

.bottom-nav::before {

    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    background:

        linear-gradient(
            115deg,
            rgba(255,255,255,0.20),
            transparent 28%,
            transparent 65%,
            rgba(255,255,255,0.08)
        );

    pointer-events: none;

    z-index: -1;
}

.bottom-nav::after {

    content: "";

    position: absolute;

    width: 190px;

    height: 90px;

    left: -210px;

    top: -10px;

    border-radius: 50%;

    background:

        radial-gradient(
            ellipse,
            rgba(255,255,255,0.16),
            transparent 70%
        );

    filter:
        blur(8px);

    pointer-events: none;

    animation:
        liquidNavShine 7s
        ease-in-out infinite;

    z-index: -1;
}

@keyframes liquidNavShine {

    0%, 45% {

        left: -210px;

        opacity: 0;
    }

    55% {

        opacity: 1;
    }

    75%, 100% {

        left:
            calc(100% + 40px);

        opacity: 0;
    }
}

.nav-item {

    position: relative;

    flex: 1;

    height: 58px;

    display: flex;

    flex-direction: column;

    align-items: center;

    text-decoration: none;

.nav-item::before {

        rgba(255,255,255,0.13);

        rgba(0,0,0,0.10);

    z-index: -1;
}

.nav-item.active {

    color: #ffffff;

    text-shadow:
        0 0 12px
        rgba(101,199,255,0.35);
}

.nav-item.active::before {

    opacity: 1;

    transform:
        scale(1);
}

.nav-item.active::after {

    content: "";

    position: absolute;

    width: 32px;

    height: 5px;

    bottom: 5px;

    left: 50%;

    transform:
        translateX(-50%);

    border-radius: 999px;

    background:
        rgba(101,199,255,0.65);

    opacity: 0.55;

}

.nav-icon {

    position: relative;

}

.nav-item.active .nav-icon {

    transform:
        translateY(-1px)

    filter:
        drop-shadow(
            0 2px 8px

}

.nav-item:active {

    transform:
        scale(0.88);
}

.nav-item:active::before {

    background:
        rgba(255,255,255,0.20);

    transform:
        scale(0.92);
}

.nav-item:active .nav-icon {

    transform:
        scale(0.90);
}

@media (hover: hover) {

    .nav-item:hover {

        color:
            rgba(255,255,255,0.88);

        transform:
            translateY(-1px);
    }

    .nav-item:hover::before {

        opacity: 0.55;

        transform:

    }
}

@media (max-width: 520px) {

    .bottom-nav {

        bottom:
            max(
                12px,
                env(safe-area-inset-bottom)
            );

        width:
            calc(100% - 18px);

        height: 70px;

        padding: 5px;

        border-radius: 999px;

        box-shadow:

            0 18px 48px
            rgba(0,0,0,0.42),

            inset 0 1px 0
            rgba(255,255,255,0.26),

            inset 0 -1px 0
            rgba(255,255,255,0.05);
    }

    .nav-item {

        height: 58px;

        font-size: 10px;
    }

    .nav-icon {

}

@media (prefers-reduced-motion: reduce) {

    .bottom-nav::after {

        animation: none;
    }

    .atmosphere-location-dot::after {

        animation: none;

}

/* MOBILE */

@media (max-width: 600px) {

    .app {

        padding-top: 20px;

}

<script>

/* =========================================================
   ATMOSPHERE RADAR
   SHARED LOCATION + WINDY
========================================================= */

/* =========================================================
   WINDY API KEY
========================================================= */

const WINDY_API_KEY =
    "WOz89BK1t4WWAed5Xb28eMdK5yJm9NXe";

/* =========================================================
   LOCATION STORAGE
========================================================= */

const LOCATION_STORAGE_KEY =
    "atmosphereUserLocation";

/* =========================================================
   FALLBACK LOCATION
========================================================= */

let userLat =
    38.5;

let userLon =
    -77.0;

/* =========================================================
   CURRENT LAYER
========================================================= */

let currentLayer =
    "wind";

/* =========================================================
   DOM
========================================================= */

const buttons =
    document.querySelectorAll(
        ".layer-button"
    );

const locationLabel =
    document.getElementById(
        "map-location-label"
    );

const locationLoading =
    document.getElementById(
        "location-loading"
    );

/* =========================================================
   WINDY STATE
========================================================= */

let windyAPI =
    null;

let userLocationMarker =
    null;

let locationReady =
    false;

/* =========================================================
   LOCATION LABEL
========================================================= */

function updateLocationLabel(text) {

    if (locationLabel) {

        locationLabel.textContent =
            text;

    }

}

/* =========================================================
   HIDE LOADING
========================================================= */

function hideLocationLoading() {

    if (locationLoading) {

        locationLoading.classList.add(
            "hidden"
        );

    }

}

/* =========================================================
   GET SAVED LOCATION
========================================================= */

function getSavedAtmosphereLocation() {

    try {

        const saved =
            localStorage.getItem(
                LOCATION_STORAGE_KEY
            );

        if (!saved) {

            return null;

        }

        const data =
            JSON.parse(saved);

        if (!data) {

            return null;

        }

        /*
            Convert to numbers.

            This is important because
            localStorage stores text.
        */

        const lat =
            Number(data.lat);

        const lon =
            Number(data.lon);

        if (
            !Number.isFinite(lat) ||
            !Number.isFinite(lon)
        ) {

            return null;

        }

        if (
            lat < -90 ||
            lat > 90 ||
            lon < -180 ||
            lon > 180
        ) {

            return null;

        }

        return {

            lat:
                lat,

            lon:
                lon

        };

    } catch (error) {

        console.warn(
            "Could not read saved location:",
            error
        );

        return null;

    }

}

/* =========================================================
   SAVE LOCATION
========================================================= */

function saveAtmosphereLocation(
    lat,
    lon
) {

    try {

        localStorage.setItem(

            LOCATION_STORAGE_KEY,

            JSON.stringify({

                lat:
                    Number(lat),

                lon:
                    Number(lon),

                timestamp:
                    Date.now()

            })

        );

    } catch (error) {

        console.warn(
            "Could not save location:",
            error
        );

    }

}

/* =========================================================
   APPLY LOCATION
========================================================= */

function applyLocation(
    lat,
    lon
) {

    userLat =
        Number(lat);

    userLon =
        Number(lon);

    locationReady =
        true;

    console.log(
        "Atmosphere location:",
        userLat,
        userLon
    );

    updateLocationLabel(
        "📍 Your current location"
    );

    if (windyAPI && windyAPI.map) {

        windyAPI.map.setView(

            [
                userLat,
                userLon
            ],

            8,

            {
                animate: false
            }

        );

        placeUserMarker();

    }

    hideLocationLoading();

}

/* =========================================================
   CREATE LOCATION PANE
========================================================= */

function createLocationPane() {

    if (
        !windyAPI ||
        !windyAPI.map
    ) {

        return null;

    }

    const map =
        windyAPI.map;

    let pane =
        map.getPane(
            "atmosphereLocationPane"
        );

    if (!pane) {

        pane =
            map.createPane(
                "atmosphereLocationPane"
            );

    }

    pane.style.zIndex =
        "100000";

    pane.style.pointerEvents =
        "none";

    return pane;

}

/* =========================================================
   PLACE BLUE DOT
========================================================= */

function placeUserMarker() {

    if (
        !windyAPI ||
        !windyAPI.map ||
        !locationReady
    ) {

        return;

    }

    const map =
        windyAPI.map;

    createLocationPane();

    /*
        If marker already exists,
        simply move it.
    */

    if (userLocationMarker) {

        userLocationMarker.setLatLng(

            [
                userLat,
                userLon
            ]

        );

        /*
            Make absolutely sure
            it is still on the map.
        */

        if (
            !map.hasLayer(
                userLocationMarker
            )
        ) {

            userLocationMarker.addTo(
                map
            );

        }

        return;

    }

    /*
        Create the blue dot.
    */

    const icon =
        L.divIcon({

            className:
                "atmosphere-location-marker",

            html:
                '<div class="atmosphere-location-dot"></div>',

            iconSize:
                [26, 26],

            iconAnchor:
                [13, 13]

        });

    userLocationMarker =
        L.marker(

            [
                userLat,
                userLon
            ],

            {

                icon:
                    icon,

                pane:
                    "atmosphereLocationPane",

                interactive:
                    false,

                keyboard:
                    false,

                zIndexOffset:
                    100000

            }

        );

    userLocationMarker.addTo(
        map
    );

    /*
        Explicitly move it to the
        current geographic coordinates.
    */

    userLocationMarker.setLatLng(

        [
            userLat,
            userLon
        ]

    );

    console.log(
        "BLUE DOT CREATED:",
        userLat,
        userLon
    );

}

/* =========================================================
   USE SAVED HOMEPAGE LOCATION
========================================================= */

function useSavedLocation() {

    const saved =
        getSavedAtmosphereLocation();

    if (!saved) {

        return false;

    }

    console.log(
        "Using location saved by homepage:",
        saved.lat,
        saved.lon
    );

    applyLocation(
        saved.lat,
        saved.lon
    );

    return true;

}

/* =========================================================
   GET GPS IF NEEDED
========================================================= */

function requestLocationIfNeeded() {

    /*
        First try localStorage.
    */

    if (
        useSavedLocation()
    ) {

        return;

    }

    /*
        No location was saved.

        Request it directly.
    */

    if (!navigator.geolocation) {

        console.warn(
            "Geolocation is not supported."
        );

        updateLocationLabel(
            "📍 Maryland & surrounding region"
        );

        hideLocationLoading();

        return;

    }

    updateLocationLabel(
        "📍 Finding your location..."
    );

    if (locationLoading) {

        locationLoading.textContent =
            "📍 Finding your current location...";

    }

    console.log(
        "Requesting browser location..."
    );

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const lat =
                Number(
                    position.coords.latitude
                );

            const lon =
                Number(
                    position.coords.longitude
                );

            saveAtmosphereLocation(
                lat,
                lon
            );

            applyLocation(
                lat,
                lon
            );

        },

        function(error) {

            console.warn(
                "Location request failed:",
                error
            );

            updateLocationLabel(
                "📍 Maryland & surrounding region"
            );

            hideLocationLoading();

        },

        {

            enableHighAccuracy:
                true,

            timeout:
                10000,

            maximumAge:
                300000

        }

    );

}

/* =========================================================
   WINDY OPTIONS
========================================================= */

/*
    IMPORTANT:

    Read localStorage BEFORE Windy starts.

    This means Windy itself starts at the
    homepage's saved location.
*/

const initialSavedLocation =
    getSavedAtmosphereLocation();

if (initialSavedLocation) {

    userLat =
        initialSavedLocation.lat;

    userLon =
        initialSavedLocation.lon;

    locationReady =
        true;

    console.log(
        "Windy starting at saved location:",
        userLat,
        userLon
    );

}

const windyOptions = {

    key:
        WINDY_API_KEY,

    lat:
        userLat,

    lon:
        userLon,

    zoom:
        8,

    overlay:
        "wind",

    product:
        "ecmwf",

    level:
        "surface",

    metricTemp:
        "°F",

    metricWind:
        "mph",

    metricRain:
        "in",

    hourFormat:
        "12h"

};

/* =========================================================
   WINDY INITIALIZATION
========================================================= */

let windyStarted =
    false;

try {

    windyInit(

        windyOptions,

        function(api) {

            windyStarted =
                true;

            console.log(
                "Windy map initialized."
            );

            windyAPI =
                api;

            const map =
                windyAPI.map;

            const store =
                windyAPI.store;

            createLocationPane();

            store.set(
                "overlay",
                currentLayer
            );

            /*
                Re-read the shared location
                after Windy has initialized.
            */

            const saved =
                getSavedAtmosphereLocation();

            if (saved) {

                userLat =
                    saved.lat;

                userLon =
                    saved.lon;

                locationReady =
                    true;

                updateLocationLabel(
                    "📍 Your current location"
                );

                map.setView(

                    [
                        userLat,
                        userLon
                    ],

                    8,

                    {
                        animate: false
                    }

                );

                placeUserMarker();

                hideLocationLoading();

            } else {

                /*
                    No saved location.

                    Get GPS now.
                */

                requestLocationIfNeeded();

            }

            /*
                Extra marker passes.

                Windy can take a moment to finish
                building its map layers.
            */

            setTimeout(
                function() {

                    placeUserMarker();

                },
                500
            );

            setTimeout(
                function() {

                    placeUserMarker();

                },
                1500
            );

            setTimeout(
                function() {

                    placeUserMarker();

                },
                3000
            );

        }

    );

} catch (error) {

    console.error(
        "Windy initialization failed:",
        error
    );

    updateLocationLabel(
        "📍 Radar location unavailable"
    );

    hideLocationLoading();

}

/* =========================================================
   SAFETY TIMEOUT
========================================================= */

/*
    This prevents the center loading message
    from being stuck forever.
*/

setTimeout(

    function() {

        hideLocationLoading();

        /*
            If Windy has initialized but the
            location hasn't been found yet,
            try the location system one more time.
        */

        if (
            windyAPI &&
            !locationReady
        ) {

            requestLocationIfNeeded();

        }

    },

    12000

);

/* =========================================================
   LAYER BUTTONS
========================================================= */

buttons.forEach(

    button => {

        button.addEventListener(

            "click",

            function() {

                buttons.forEach(

                    other => {

                        other.classList.remove(
                            "active"
                        );

                        other.style.background =
                            "";

                        other.style.boxShadow =
                            "";

                    }

                );

                button.classList.add(
                    "active"
                );

                currentLayer =
                    button.dataset.layer;

                const color =
                    button.dataset.color;

                button.style.background =
                    color;

                button.style.boxShadow =
                    `0 0 14px ${color}55`;

                if (
                    windyAPI &&
                    windyAPI.store
                ) {

                    windyAPI.store.set(
                        "overlay",
                        currentLayer
                    );

                    /*
                        Reassert the blue dot.
                    */

                    setTimeout(

                        function() {

                            createLocationPane();

                            placeUserMarker();

                        },

                        250

                    );

                    setTimeout(

                        function() {

                            placeUserMarker();

                        },

                        1000

                    );

                }

            }

        );

    }

);

/* =========================================================
   INITIAL ACTIVE BUTTON
========================================================= */

const initialButton =
    document.querySelector(
        ".layer-button.active"
    );

if (initialButton) {

    initialButton.style.background =
        initialButton.dataset.color;

    initialButton.style.boxShadow =
        `0 0 14px ${initialButton.dataset.color}55`;

}

/* =========================================================
   MAP MOVEMENT / ZOOM
========================================================= */

window.addEventListener(

    "resize",

    function() {

        if (
            windyAPI &&
            windyAPI.map
        ) {

            windyAPI.map.invalidateSize();

            setTimeout(

                function() {

                    placeUserMarker();

                },

                100

            );

        }

    }

);

/* =========================================================
   EXTRA MARKER PROTECTION
========================================================= */

setInterval(

    function() {

        if (
            windyAPI &&
            windyAPI.map &&
            locationReady
        ) {

            createLocationPane();

            placeUserMarker();

        }

    },

    2000

);

</script>

</body>

</html>
