.bottom-nav {
    position: fixed;

    left: 50%;
    bottom: 14px;

    transform: translateX(-50%);

    width: calc(100% - 24px);

    height: 72px;

        );

        rgba(255,255,255,0.18);

    border-radius: 999px;

    backdrop-filter:
        blur(30px)
        saturate(180%);

    -webkit-backdrop-filter:
        blur(30px)
        saturate(180%);

    box-shadow:
        0 20px 55px rgba(0,0,0,0.38),
        0 4px 18px rgba(0,0,0,0.20),
        inset 0 1px 0 rgba(255,255,255,0.28),
        inset 0 -1px 0 rgba(255,255,255,0.06);

    overflow: hidden;

    z-index: 100;

    isolation: isolate;

    transition:
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        box-shadow 0.35s ease;
}

/* Glass reflection */

.bottom-nav::before {
    content: "";

    position: absolute;

    inset: 0;

    border-radius: inherit;

    background:
        linear-gradient(
            115deg,
            rgba(255,255,255,0.20),
            transparent 28%,
            transparent 65%,
            rgba(255,255,255,0.08)
        );

    pointer-events: none;

    z-index: -1;
}

/* Moving liquid reflection */

.bottom-nav::after {
    content: "";

    position: absolute;

    width: 190px;
    height: 90px;

    left: -210px;
    top: -10px;

    border-radius: 50%;

    background:
        radial-gradient(
            ellipse,
            rgba(255,255,255,0.16),
            transparent 70%
        );

    filter: blur(8px);

    pointer-events: none;

    animation:
        liquidNavShine 7s ease-in-out infinite;

    z-index: -1;
}

@keyframes liquidNavShine {

    0%, 45% {
        left: -210px;
        opacity: 0;
    }

    55% {
        opacity: 1;
    }

    75%, 100% {
        left: calc(100% + 40px);
        opacity: 0;
    }

}

<div class="app">


    <!-- HEADER -->

        </p>

    </header>

            class="layer-button active"

            title="Atmosphere Weather Radar"
            loading="lazy"
            allowfullscreen>
        </iframe>


    </div>

<script>


/* =========================================================
   USER LOCATION + WINDY RADAR
========================================================= */


/*
    Default/fallback location.

    If the user denies location access,
    the radar will fall back to these
    Maryland coordinates.
*/

let userLat = 38.5;

let userLon = -77.0;


/*
    Keep track of the currently
    selected Windy layer.
*/

let currentLayer = "wind";


/*
    Get the layer buttons.
*/

const buttons =
    document.querySelectorAll(
        ".layer-button"
    );


/*
    Get the Windy iframe.
*/

const map =
    document.getElementById(
        "windy-map"
    );


/*
    Get the location label.
*/

const locationLabel =
    document.getElementById(
        "map-location-label"
    );


/* =========================================================
   BUILD WINDY MAP URL
========================================================= */

function updateWindyMap() {

    const src =

        "https://embed.windy.com/embed.html" +

        "?type=map" +

        "&location=coordinates" +

        "&metricRain=in" +

        "&metricTemp=°F" +

        "&metricWind=mph" +

        /*
            Zoom 8 gives a much more useful
            local view than the original zoom 5.
        */

        "&zoom=8" +

        "&overlay=" +
        encodeURIComponent(
            currentLayer
        ) +

        "&product=ecmwf" +

        "&level=surface" +

        "&lat=" +
        encodeURIComponent(
            userLat
        ) +

        "&lon=" +
        encodeURIComponent(
            userLon
        ) +

        "&message=true";


    /*
        Reload Windy using the
        current coordinates.
    */

    map.src = src;

}


/* =========================================================
   GET USER'S CURRENT LOCATION
========================================================= */

function getUserLocation() {


    /*
        Check whether this browser
        supports geolocation.
    */

    if (!navigator.geolocation) {

        locationLabel.textContent =
            "📍 Location unavailable";

        /*
            Use fallback coordinates.
        */

        updateWindyMap();

        return;

    }


    /*
        Ask the browser for the
        user's current position.
    */

    navigator.geolocation.getCurrentPosition(

        /*
            SUCCESS
        */

        function(position) {


            /*
                Save the user's actual
                latitude and longitude.
            */

            userLat =
                position.coords.latitude;

            userLon =
                position.coords.longitude;


            /*
                Update the label.
            */

            locationLabel.textContent =
                "📍 Your current location";


            /*
                Reload Windy centered
                on the user's location.
            */

            updateWindyMap();

        },


        /*
            ERROR / PERMISSION DENIED
        */

        function(error) {

            console.warn(
                "Unable to get user location:",
                error
            );


            /*
                Keep the existing Maryland
                fallback location.
            */

            locationLabel.textContent =
                "📍 Maryland & surrounding region";


            updateWindyMap();

        },


        /*
            LOCATION SETTINGS
        */

        {
            enableHighAccuracy: true,

            timeout: 10000,

            maximumAge: 300000
        }

    );

}


/* =========================================================
   WINDY LAYER BUTTONS
========================================================= */


buttons.forEach(

    button => {


        button.addEventListener(

            "click",

            () => {


                /*
                    Remove active state
                    from every button.
                */

                buttons.forEach(

                    other => {

                        other.classList.remove(
                            "active"
                        );

                        other.style.background =
                            "";

                        other.style.boxShadow =
                            "";

                    }

                );


                /*
                    Activate selected button.
                */

                button.classList.add(
                    "active"
                );


                /*
                    Save the selected layer.
                */

                currentLayer =
                    button.dataset.layer;


                const color =
                    button.dataset.color;


                /*
                    Apply the button color.
                */

                button.style.background =
                    color;


                button.style.boxShadow =
                    `0 0 14px ${color}55`;


                /*
                    Rebuild the map using
                    the user's saved location.
                */

                updateWindyMap();

            }

        );

    }

);


/* =========================================================
   INITIAL ACTIVE BUTTON COLOR
========================================================= */


const initial =
    document.querySelector(
        ".layer-button.active"
    );


if (initial) {

    initial.style.background =
        initial.dataset.color;

    initial.style.boxShadow =
        `0 0 14px ${initial.dataset.color}55`;

}


/* =========================================================
   START LOCATION DETECTION
========================================================= */


/*
    Ask for the user's location
    when the Radar page loads.
*/

getUserLocation();


</script>


</body>

</html>
