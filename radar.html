<style>

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }


    :root {

        --background: #07111f;

        --card:
            rgba(255,255,255,0.075);

        --border:
            rgba(255,255,255,0.11);

        --blue: #7dd3fc;

        --muted:

    }


    body {

        min-height: 100vh;

        font-family:
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            Arial,
            sans-serif;

        color: white;

        background:

            radial-gradient(

                rgba(56,189,248,0.16),

    .app {

        max-width: 1000px;

        margin: 0 auto;

    }


    /* HEADER */

    .header {

        text-align: center;

        margin-bottom: 20px;
    }


    .header h1 {

        font-size: 27px;

        font-weight: 750;

        letter-spacing: -0.7px;
    }


    .header p {

        color: var(--muted);

        font-size: 14px;

        margin-top: 5px;
    }


    /* LAYER PICKER */

    .layer-picker {

        display: flex;

        gap: 8px;

        flex-wrap: wrap;

        justify-content: center;

        margin-bottom: 14px;
    }


    .layer-button {

        padding:
            9px 15px;

        border-radius: 13px;

        border:
            1px solid
            rgba(0,242,255,0.15);

        cursor: pointer;

        font-weight: 650;

        font-size: 13px;

        color:
            rgba(255,255,255,0.70);

        background:
            rgba(0,242,255,0.06);

        transition:
            transform 0.15s ease,
            background 0.2s ease,
            box-shadow 0.2s ease;

        box-shadow:
            0 4px 16px
            rgba(0,120,255,0.10);
    }


    .layer-button:hover {

        transform:
            translateY(-1px);

        background:
            rgba(0,242,255,0.11);
    }


    .layer-button:active {

        transform:
            scale(0.96);
    }


    .layer-button.active {

        border-color:
            transparent;

        color:
            #07111f;
    }


    /* =========================================================
       MAP
       ========================================================= */

    .map-wrapper {

        position: relative;

        width: 100%;

        height: 78vh;

        min-height: 500px;

        max-height: 850px;

        border-radius: 24px;

        overflow: hidden;

        border:
            1px solid
            rgba(0,242,255,0.18);

        box-shadow:

            0 8px 40px
            rgba(0,120,255,0.20),

            0 1.5px 0
            rgba(0,242,255,0.20)
            inset;

        background: #0b1626;
    }


    #windy {

        position: absolute;

        left: 0;

        top: 0;

        width: 100%;

        height: 100%;
    }


    #windy > * {

        max-width: 100%;
    }


    /* =========================================================
       REAL GEOGRAPHIC BLUE LOCATION DOT
       ========================================================= */

    .atmosphere-location-marker {

        background:
            transparent !important;

        border:
            none !important;

        width:
            20px !important;

        height:
            20px !important;
    }


    .atmosphere-location-dot {

        width: 20px;

        height: 20px;

        border-radius: 50%;

        background:
            #1683ff;

        border:
            3px solid white;

        box-shadow:

            0 0 0 3px
            rgba(22,131,255,0.30),

            0 2px 10px
            rgba(0,0,0,0.45);

        position: relative;

        pointer-events: none;
    }


    .atmosphere-location-dot::after {

        content: "";

        position: absolute;

        left: 50%;

        top: 50%;

        width: 34px;

        height: 34px;

        transform:
            translate(-50%, -50%);

        border-radius: 50%;

        border:
            2px solid
            rgba(22,131,255,0.42);

        animation:
            locationPulse 2s ease-out infinite;

        pointer-events: none;
    }


    @keyframes locationPulse {

        0% {

            transform:
                translate(-50%, -50%)
                scale(0.55);

            opacity: 0.8;
        }

        70% {

            transform:
                translate(-50%, -50%)
                scale(1.15);

            opacity: 0;
        }

        100% {

            transform:
                translate(-50%, -50%)
                scale(1.15);

            opacity: 0;
        }

    }


    .atmosphere-location-pane {

        z-index: 10000 !important;

        pointer-events:
            none !important;
    }


    /* MAP LOCATION LABEL */

    .map-label {

        position: absolute;

        top: 14px;

        left: 14px;

        z-index: 1000;

        padding:
            8px 12px;

        border-radius: 12px;

        background:
            rgba(7,17,31,0.72);

        border:
            1px solid
            rgba(255,255,255,0.14);

        color:
            rgba(255,255,255,0.92);

        font-size: 12px;

        font-weight: 650;

        backdrop-filter:
            blur(14px)
            saturate(160%);

        -webkit-backdrop-filter:
            blur(14px)
            saturate(160%);

        box-shadow:
            0 5px 20px
            rgba(0,0,0,0.20);

        pointer-events: none;

        transition:
            opacity 0.25s ease;
    }


    /* LOCATION LOADING */

    .location-loading {

        position: absolute;

        left: 50%;

        top: 50%;

        transform:
            translate(-50%, -50%);

        z-index: 2000;

        padding:
            12px 16px;

        border-radius: 14px;

        background:
            rgba(7,17,31,0.78);

        border:
            1px solid
            rgba(255,255,255,0.13);

        backdrop-filter:
            blur(16px);

        -webkit-backdrop-filter:
            blur(16px);

        color:
            rgba(255,255,255,0.9);

        font-size: 13px;

        font-weight: 650;

        box-shadow:
            0 10px 30px
            rgba(0,0,0,0.28);

        transition:
            opacity 0.25s ease;
    }


    .location-loading.hidden {

        opacity: 0;

        pointer-events: none;
    }


    /* =========================================================
       LIQUID GLASS NAVIGATION
       ========================================================= */

    .bottom-nav {

        position: fixed;

        left: 50%;

        bottom: 14px;

        transform:
            translateX(-50%);

        width:
            calc(100% - 24px);

        max-width: 620px;

        height: 72px;

        display: flex;

        justify-content:
            space-around;

        align-items: center;

        padding: 6px;

        background:

            linear-gradient(
                135deg,
                rgba(255,255,255,0.15),
                rgba(255,255,255,0.055)
            );

        border:
            1px solid
            rgba(255,255,255,0.18);

        border-radius: 999px;

        backdrop-filter:
            blur(30px)
            saturate(180%);

        -webkit-backdrop-filter:
            blur(30px)
            saturate(180%);

        box-shadow:

            0 20px 55px
            rgba(0,0,0,0.38),

            0 4px 18px
            rgba(0,0,0,0.20),

            inset 0 1px 0
            rgba(255,255,255,0.28),

            inset 0 -1px 0
            rgba(255,255,255,0.06);

        overflow: hidden;

        z-index: 10000;

        isolation: isolate;

        transition:
            transform 0.35s
            cubic-bezier(0.22, 1, 0.36, 1),

            box-shadow 0.35s ease;
    }


    .bottom-nav::before {

        content: "";

        position: absolute;

        inset: 0;

        border-radius: inherit;

        background:

            linear-gradient(
                115deg,
                rgba(255,255,255,0.20),
                transparent 28%,
                transparent 65%,
                rgba(255,255,255,0.08)
            );

        pointer-events: none;

        z-index: -1;
    }


    .bottom-nav::after {

        content: "";

        position: absolute;

        width: 190px;

        height: 90px;

        left: -210px;

        top: -10px;

        border-radius: 50%;

        background:

            radial-gradient(
                ellipse,
                rgba(255,255,255,0.16),
                transparent 70%
            );

        filter:
            blur(8px);

        pointer-events: none;

        animation:
            liquidNavShine 7s
            ease-in-out infinite;

        z-index: -1;
    }


    @keyframes liquidNavShine {

        0%, 45% {

            left: -210px;

            opacity: 0;
        }

        55% {

            opacity: 1;
        }

        75%, 100% {

            left:
                calc(100% + 40px);

            opacity: 0;
        }

    }


    .nav-item {

        position: relative;

        flex: 1;

        height: 58px;

        display: flex;

        flex-direction: column;

        align-items: center;

        justify-content: center;

        text-decoration: none;

        color:
            rgba(255,255,255,0.52);

        text-align: center;

        font-size: 10px;

        font-weight: 650;

        letter-spacing: 0.1px;

        border-radius: 999px;

    .nav-item::before {

        position: absolute;

        border:
            1px solid
            rgba(255,255,255,0.13);

        box-shadow:

            inset 0 1px 0
            rgba(255,255,255,0.16),

            0 4px 14px
            rgba(0,0,0,0.10);

        opacity: 0;

        transform:
            scale(0.72);

        transition:
            opacity 0.35s ease,
            transform 0.4s
            cubic-bezier(0.22, 1, 0.36, 1);

        z-index: -1;
    }


    .nav-item.active {

        color: #ffffff;

        text-shadow:
            0 0 12px
            rgba(101,199,255,0.35);
    }


    .nav-item.active::before {

        opacity: 1;

        transform:
            scale(1);
    }


    .nav-item.active::after {

        content: "";

        position: absolute;

        width: 32px;

        height: 5px;

        bottom: 5px;

        left: 50%;

        transform:
            translateX(-50%);

        border-radius: 999px;

        background:
            rgba(101,199,255,0.65);

            blur(7px);

        opacity: 0.55;

        pointer-events: none;
    }


    .nav-icon {

        position: relative;

    .nav-item.active .nav-icon {

        transform:
            translateY(-1px)

        filter:
            drop-shadow(
                0 2px 8px
                rgba(101,199,255,0.35)
            );
    }


    .nav-item:active {

        transform:
            scale(0.88);
    }


    .nav-item:active::before {

        background:
            rgba(255,255,255,0.20);

        transform:
            scale(0.92);
    }


    .nav-item:active .nav-icon {

        transform:
            scale(0.90);
    }


    @media (hover: hover) {

        .nav-item:hover {

            color:
                rgba(255,255,255,0.88);

            transform:
                translateY(-1px);
        }

        .nav-item:hover::before {

            opacity: 0.55;

            transform:
                scale(0.94);
        }

    }


    @media (max-width: 520px) {

        .bottom-nav {

            bottom:
                max(
                    12px,
                    env(safe-area-inset-bottom)
                );

            width:
                calc(100% - 18px);

            height: 70px;

            padding: 5px;

            border-radius: 999px;

            box-shadow:

                0 18px 48px

                inset 0 1px 0

        }

        .nav-item {

    @media (prefers-reduced-motion: reduce) {

    /* MOBILE */

<script>


/* =========================================================
   ATMOSPHERE RADAR
   WINDY + SHARED ATMOSPHERE USER LOCATION
========================================================= */


/* =========================================================
   WINDY API KEY
========================================================= */


/*
    Put your Windy Map Forecast API key here.

    IMPORTANT:
    This is left as your existing key so the rest of
    the radar page remains unchanged.
*/

const WINDY_API_KEY =
    "WOz89BK1t4WWAed5Xb28eMdK5yJm9NXe";


/* =========================================================
   DEFAULT / FALLBACK LOCATION
========================================================= */

let userLat =
    38.5;

let userLon =
    -77.0;


/* =========================================================
   CURRENT LAYER
========================================================= */

let currentLayer =
    "wind";


/* =========================================================
   DOM ELEMENTS
========================================================= */

const buttons =
    document.querySelectorAll(
        ".layer-button"
    );


const locationLabel =
    document.getElementById(
        "map-location-label"
    );


const locationLoading =
    document.getElementById(
        "location-loading"
    );


/* =========================================================
   WINDY API STATE
========================================================= */

let windyAPI =
    null;


let userLocationMarker =
    null;


/* =========================================================
   SHARED LOCATION STORAGE
========================================================= */

const LOCATION_STORAGE_KEY =
    "atmosphereUserLocation";


/* =========================================================
   UPDATE LOCATION LABEL
========================================================= */

function updateLocationLabel(text) {

    locationLabel.textContent =
        text;

}


/* =========================================================
   HIDE LOCATION LOADING
========================================================= */

function hideLocationLoading() {

    if (locationLoading) {

        locationLoading.classList.add(
            "hidden"
        );

    }

}


/* =========================================================
   READ LOCATION SAVED BY HOMEPAGE
========================================================= */

function getSavedAtmosphereLocation() {

    try {

        const saved =
            localStorage.getItem(
                LOCATION_STORAGE_KEY
            );


        if (!saved) {

            return null;

        }


        const location =
            JSON.parse(saved);


        if (
            !location ||
            typeof location.lat !== "number" ||
            typeof location.lon !== "number"
        ) {

            return null;

        }


        /*
            Make sure the coordinates are
            legitimate latitude/longitude values.
        */

        if (
            location.lat < -90 ||
            location.lat > 90 ||
            location.lon < -180 ||
            location.lon > 180
        ) {

            return null;

        }


        return location;

    } catch (error) {

        console.warn(
            "Unable to read saved Atmosphere location:",
            error
        );

        return null;

    }

}


/* =========================================================
   SAVE LOCATION
========================================================= */

function saveAtmosphereLocation(lat, lon) {

    try {

        localStorage.setItem(

            LOCATION_STORAGE_KEY,

            JSON.stringify({

                lat:
                    lat,

                lon:
                    lon,

                timestamp:
                    Date.now()

            })

        );

    } catch (error) {

        console.warn(
            "Unable to save Atmosphere location:",
            error
        );

    }

}


/* =========================================================
   CREATE LOCATION PANE
========================================================= */

function createLocationPane() {

    if (!windyAPI) {

        return;

    }


    const map =
        windyAPI.map;


    let pane =
        map.getPane(
            "atmosphereLocationPane"
        );


    if (!pane) {

        pane =
            map.createPane(
                "atmosphereLocationPane"
            );

    }


    pane.style.zIndex =
        "10000";

    pane.style.pointerEvents =
        "none";

}


/* =========================================================
   CREATE REAL GEOGRAPHIC BLUE DOT
========================================================= */

function updateUserMarker() {

    if (!windyAPI) {

        return;

    }


    const map =
        windyAPI.map;


    createLocationPane();


    /*
        If a marker already exists,
        move the same geographic marker.
    */

    if (userLocationMarker) {

        userLocationMarker.setLatLng(

            [
                userLat,
                userLon
            ]

        );

        return;

    }


    const locationIcon =
        L.divIcon({

            className:
                "atmosphere-location-marker",

            html:
                `
                <div
                    class="atmosphere-location-dot"
                    aria-label="Your current location">
                </div>
                `,

            iconSize:
                [20, 20],

            iconAnchor:
                [10, 10],

            popupAnchor:
                [0, -10]

        });


    /*
        This is a REAL geographic Leaflet
        marker.

        It is attached to latitude/longitude,
        not to a fixed position on the screen.
    */

    userLocationMarker =
        L.marker(

            [
                userLat,
                userLon
            ],

            {

                icon:
                    locationIcon,

                pane:
                    "atmosphereLocationPane",

                zIndexOffset:
                    10000,

                interactive:
                    false

            }

        );


    userLocationMarker.addTo(
        map
    );


    userLocationMarker.setLatLng(

        [
            userLat,
            userLon
        ]

    );


    console.log(
        "Atmosphere blue dot placed at:",
        userLat,
        userLon
    );

}


/* =========================================================
   CENTER MAP ON USER
========================================================= */

function centerMapOnUser() {

    if (!windyAPI) {

        return;

    }


    const map =
        windyAPI.map;


    map.setView(

        [
            userLat,
            userLon
        ],

        8,

        {
            animate: true
        }

    );


    updateUserMarker();

}


/* =========================================================
   USE SAVED HOMEPAGE LOCATION
========================================================= */

function useSavedLocation() {

    const savedLocation =
        getSavedAtmosphereLocation();


    if (!savedLocation) {

        return false;

    }


    userLat =
        savedLocation.lat;

    userLon =
        savedLocation.lon;


    console.log(
        "Atmosphere reused homepage location:",
        userLat,
        userLon
    );


    updateLocationLabel(
        "📍 Your current location"
    );


    hideLocationLoading();


    centerMapOnUser();


    return true;

}


/* =========================================================
   GET LOCATION ONLY IF HOMEPAGE LOCATION IS UNAVAILABLE
========================================================= */

function getUserLocationIfNeeded() {

    /*
        FIRST:

        Try the exact coordinates that
        the homepage already obtained.

        This prevents a second GPS
        permission/location request.
    */

    if (
        useSavedLocation()
    ) {

        return;

    }


    /*
        There is no saved homepage location.

        This can happen if someone opens
        radar.html directly before visiting
        the homepage.
    */

    if (!navigator.geolocation) {

        console.warn(
            "Geolocation is not supported."
        );


        updateLocationLabel(
            "📍 Maryland & surrounding region"
        );


        hideLocationLoading();


        centerMapOnUser();

        return;

    }


    updateLocationLabel(
        "📍 Finding your location..."
    );


    console.log(
        "No saved Atmosphere location found. Requesting location once..."
    );


    navigator.geolocation.getCurrentPosition(

        function(position) {

            userLat =
                position.coords.latitude;

            userLon =
                position.coords.longitude;


            /*
                Save it so every other
                Atmosphere page can reuse it.
            */

            saveAtmosphereLocation(
                userLat,
                userLon
            );


            console.log(
                "Atmosphere GPS location:",
                userLat,
                userLon
            );


            updateLocationLabel(
                "📍 Your current location"
            );


            hideLocationLoading();


            centerMapOnUser();

        },


        function(error) {

            console.warn(
                "Unable to get user location:",
                error
            );


            updateLocationLabel(
                "📍 Maryland & surrounding region"
            );


            hideLocationLoading();


            centerMapOnUser();

        },


        {

            enableHighAccuracy:
                true,

            timeout:
                10000,

            maximumAge:
                300000

        }

    );

}


/* =========================================================
   WINDY MAP OPTIONS
========================================================= */

const windyOptions = {

    key:
        WINDY_API_KEY,

    lat:
        userLat,

    lon:
        userLon,

    zoom:
        8,

    overlay:
        "wind",

    product:
        "ecmwf",

    level:
        "surface",

    metricTemp:
        "°F",

    metricWind:
        "mph",

    metricRain:
        "in",

    hourFormat:
        "12h"

};


/* =========================================================
   INITIALIZE WINDY
========================================================= */

windyInit(

    windyOptions,

    function(api) {

        console.log(
            "Windy map initialized."
        );


        windyAPI =
            api;


        const {
            map,
            store
        } = windyAPI;


        createLocationPane();


        store.set(
            "overlay",
            currentLayer
        );


        /*
            Try the location that the homepage
            already stored.

            If it exists, this does NOT call
            navigator.geolocation again.
        */

        const savedLocation =
            getSavedAtmosphereLocation();


        if (savedLocation) {

            userLat =
                savedLocation.lat;

            userLon =
                savedLocation.lon;

        }


        map.setView(

            [
                userLat,
                userLon
            ],

            8

        );


        /*
            Put the geographic blue dot
            at the saved location.
        */

        updateUserMarker();


        /*
            Now finish the location process.

            In the normal flow, this simply
            reuses localStorage.

            It only asks for GPS if there
            is no saved location.
        */

        setTimeout(

            function() {

                getUserLocationIfNeeded();

            },

            100

        );

    }

);


/* =========================================================
   LAYER BUTTONS
========================================================= */

buttons.forEach(

    button => {

        button.addEventListener(

            "click",

            () => {

                buttons.forEach(

                    other => {

                        other.classList.remove(
                            "active"
                        );

                        other.style.background =
                            "";

                        other.style.boxShadow =
                            "";

                    }

                );


                button.classList.add(
                    "active"
                );


                currentLayer =
                    button.dataset.layer;


                const color =
                    button.dataset.color;


                button.style.background =
                    color;


                button.style.boxShadow =
                    `0 0 14px ${color}55`;


                if (windyAPI) {

                    windyAPI.store.set(
                        "overlay",
                        currentLayer
                    );


                    /*
                        Make sure the blue dot
                        remains above the radar
                        visualization.
                    */

                    setTimeout(

                        function() {

                            createLocationPane();

                            updateUserMarker();

                        },

                        150

                    );

                }

            }

        );

    }

);


/* =========================================================
   INITIAL ACTIVE BUTTON COLOR
========================================================= */

const initial =
    document.querySelector(
        ".layer-button.active"
    );


if (initial) {

    initial.style.background =
        initial.dataset.color;

    initial.style.boxShadow =
        `0 0 14px ${initial.dataset.color}55`;

}


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(

    "resize",

    function() {

        if (
            windyAPI &&
            windyAPI.map
        ) {

            windyAPI.map.invalidateSize();


            if (
                userLocationMarker
            ) {

                userLocationMarker.setLatLng(

                    [
                        userLat,
                        userLon
                    ]

                );

            }

        }

    }

);


/* =========================================================
   END
========================================================= */

</script>

</body>

</html>
